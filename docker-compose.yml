services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 12

  minio:
    # MinIO community images were deleted from Docker Hub/Quay in Sep 2026;
    # Chainguard supplies the maintained fork (same S3 API and presigns).
    image: cgr.dev/chainguard/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PUBLISHED_PORT}:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      retries: 12

  minio-setup:
    # one-shot bucket bootstrap; MC_HOST_* env = alias, no shell needed
    image: cgr.dev/chainguard/minio-client
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET}"]
    restart: "no"

  server:
    image: gochathub/server:local
    command: ["sh", "-c", "gochathub-server migrate && exec gochathub-server serve"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      COOKIE_SECURE: "false"
      ORIGIN: http://${PUBLIC_HOST}
      TRUST_PROXY: "true"
      ALLOW_UPLOADS: "1"
      S3_ENDPOINT: http://${MINIO_PUBLIC_HOST}:${MINIO_PUBLISHED_PORT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_TLS: "false"
      # Cloudflare Turnstile on password login; empty secret = off
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:-}
    # S3_ENDPOINT host is browser-visible (presigned URLs are host-signed).
    # When it is "localhost", map it to the docker host-gateway so the server's
    # boot-time bucket check reaches the published port; LAN-IP hosts need no entry.
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  caddy:
    image: gochathub/caddy:local
    ports:
      - "${PUBLISHED_PORT}:80"
    depends_on:
      - server

volumes:
  pgdata:
  miniodata: